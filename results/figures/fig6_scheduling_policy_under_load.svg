<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480" width="750" height="480" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
