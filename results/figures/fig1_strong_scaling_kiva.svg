<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <!-- Title -->
  <text x="450.0" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a252f">Figure 1b: GD-RHCR Strong Scaling on KIVA (V=5, w=10, h=5)</text>
  <!-- Panel 1: Speedup -->
  <rect x="80" y="70" width="360.0" height="340" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="260.0" y="55" text-anchor="middle" font-size="14" font-weight="600" fill="#2c3e50">Speedup (T_seq / T_par)</text>
  <line x1="80" y1="342.0" x2="440.0" y2="342.0" stroke="#e9ecef" stroke-width="1"/>
  <text x="70" y="346.0" text-anchor="end" font-size="11" fill="#6c757d">1.0x</text>
  <line x1="80" y1="274.0" x2="440.0" y2="274.0" stroke="#e9ecef" stroke-width="1"/>
  <text x="70" y="278.0" text-anchor="end" font-size="11" fill="#6c757d">2.0x</text>
  <line x1="80" y1="206.0" x2="440.0" y2="206.0" stroke="#e9ecef" stroke-width="1"/>
  <text x="70" y="210.0" text-anchor="end" font-size="11" fill="#6c757d">3.0x</text>
  <line x1="80" y1="138.0" x2="440.0" y2="138.0" stroke="#e9ecef" stroke-width="1"/>
  <text x="70" y="142.0" text-anchor="end" font-size="11" fill="#6c757d">4.0x</text>
  <line x1="80" y1="70.0" x2="440.0" y2="70.0" stroke="#e9ecef" stroke-width="1"/>
  <text x="70" y="74.0" text-anchor="end" font-size="11" fill="#6c757d">5.0x</text>
  <line x1="80" y1="410" x2="192.5" y2="70.0" stroke="#adb5bd" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="102.5" y1="70" x2="102.5" y2="410" stroke="#e9ecef" stroke-width="1"/>
  <text x="102.5" y="430" text-anchor="middle" font-size="11" fill="#495057">1</text>
  <line x1="125.0" y1="70" x2="125.0" y2="410" stroke="#e9ecef" stroke-width="1"/>
  <text x="125.0" y="430" text-anchor="middle" font-size="11" fill="#495057">2</text>
  <line x1="170.0" y1="70" x2="170.0" y2="410" stroke="#e9ecef" stroke-width="1"/>
  <text x="170.0" y="430" text-anchor="middle" font-size="11" fill="#495057">4</text>
  <line x1="260.0" y1="70" x2="260.0" y2="410" stroke="#e9ecef" stroke-width="1"/>
  <text x="260.0" y="430" text-anchor="middle" font-size="11" fill="#495057">8</text>
  <line x1="327.5" y1="70" x2="327.5" y2="410" stroke="#e9ecef" stroke-width="1"/>
  <text x="327.5" y="430" text-anchor="middle" font-size="11" fill="#495057">11</text>
  <line x1="440.0" y1="70" x2="440.0" y2="410" stroke="#e9ecef" stroke-width="1"/>
  <text x="440.0" y="430" text-anchor="middle" font-size="11" fill="#495057">16</text>
  <text x="260.0" y="455" text-anchor="middle" font-size="12" font-weight="600" fill="#2c3e50">Worker Threads (p)</text>
  <!-- Panel 2: Parallel Efficiency -->
  <rect x="500.0" y="70" width="360.0" height="340" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="680.0" y="55" text-anchor="middle" font-size="14" font-weight="600" fill="#2c3e50">Parallel Efficiency (S_p / p)</text>
  <line x1="500.0" y1="342.0" x2="860.0" y2="342.0" stroke="#e9ecef" stroke-width="1"/>
  <text x="490.0" y="346.0" text-anchor="end" font-size="11" fill="#6c757d">20%</text>
  <line x1="500.0" y1="274.0" x2="860.0" y2="274.0" stroke="#e9ecef" stroke-width="1"/>
  <text x="490.0" y="278.0" text-anchor="end" font-size="11" fill="#6c757d">40%</text>
  <line x1="500.0" y1="206.0" x2="860.0" y2="206.0" stroke="#e9ecef" stroke-width="1"/>
  <text x="490.0" y="210.0" text-anchor="end" font-size="11" fill="#6c757d">60%</text>
  <line x1="500.0" y1="138.0" x2="860.0" y2="138.0" stroke="#e9ecef" stroke-width="1"/>
  <text x="490.0" y="142.0" text-anchor="end" font-size="11" fill="#6c757d">80%</text>
  <line x1="500.0" y1="70.0" x2="860.0" y2="70.0" stroke="#e9ecef" stroke-width="1"/>
  <text x="490.0" y="74.0" text-anchor="end" font-size="11" fill="#6c757d">100%</text>
  <line x1="522.5" y1="70" x2="522.5" y2="410" stroke="#e9ecef" stroke-width="1"/>
  <text x="522.5" y="430" text-anchor="middle" font-size="11" fill="#495057">1</text>
  <line x1="545.0" y1="70" x2="545.0" y2="410" stroke="#e9ecef" stroke-width="1"/>
  <text x="545.0" y="430" text-anchor="middle" font-size="11" fill="#495057">2</text>
  <line x1="590.0" y1="70" x2="590.0" y2="410" stroke="#e9ecef" stroke-width="1"/>
  <text x="590.0" y="430" text-anchor="middle" font-size="11" fill="#495057">4</text>
  <line x1="680.0" y1="70" x2="680.0" y2="410" stroke="#e9ecef" stroke-width="1"/>
  <text x="680.0" y="430" text-anchor="middle" font-size="11" fill="#495057">8</text>
  <line x1="747.5" y1="70" x2="747.5" y2="410" stroke="#e9ecef" stroke-width="1"/>
  <text x="747.5" y="430" text-anchor="middle" font-size="11" fill="#495057">11</text>
  <line x1="860.0" y1="70" x2="860.0" y2="410" stroke="#e9ecef" stroke-width="1"/>
  <text x="860.0" y="430" text-anchor="middle" font-size="11" fill="#495057">16</text>
  <text x="680.0" y="455" text-anchor="middle" font-size="12" font-weight="600" fill="#2c3e50">Worker Threads (p)</text>
  <rect x="140.0" y="90" width="240" height="50" rx="4" fill="#ffffff" stroke="#ced4da" opacity="0.95"/>
  <circle cx="160.0" cy="106" r="4.5" fill="#27ae60"/>
  <text x="175.0" y="110" font-size="11" font-weight="600" fill="#2c3e50">KIVA N = 100 agents (10 seeds)</text>
  <rect x="156.0" y="120" width="8" height="8" fill="#8e44ad"/>
  <text x="175.0" y="128" font-size="11" font-weight="600" fill="#2c3e50">KIVA N = 400 agents (5 seeds)</text>
</svg>
